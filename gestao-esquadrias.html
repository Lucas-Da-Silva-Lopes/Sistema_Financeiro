<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gestão Esquadrias Pro</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3f5f8;--card:#fff;--tx:#18222f;--mut:#697587;--bd:#e0e5eb;--pri:#1f6feb;--ok:#168a4a;--bad:#d33a3a;--warn:#c77d00;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151b;--card:#1a212a;--tx:#e8ecf1;--mut:#8f9aa8;--bd:#2b3440;--pri:#5b9bff;--ok:#3fbf7a;--bad:#ff6b6b;--warn:#f0a93b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11151b;--card:#1a212a;--tx:#e8ecf1;--mut:#8f9aa8;--bd:#2b3440;--pri:#5b9bff;--ok:#3fbf7a;--bad:#ff6b6b;--warn:#f0a93b;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:14px 16px 4px}h1{font-size:18px;margin:0}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 16px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav button,.chip{flex:0 0 auto;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:20px;font-size:14px}
nav button.on,.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
main{padding:8px 16px 40px;max-width:900px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.grid .card{margin:0}.grid{margin-bottom:12px}
.k{font-size:12px;color:var(--mut)}.v{font-size:20px;font-weight:700;margin-top:2px}.big .v{font-size:30px}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}.mut{color:var(--mut)}
.alert{border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:14px;border:1px solid;cursor:pointer}
.alert.r{background:color-mix(in srgb,var(--bad) 14%,transparent);border-color:var(--bad)}
.alert.y{background:color-mix(in srgb,var(--warn) 14%,transparent);border-color:var(--warn)}
.alert.b{background:color-mix(in srgb,var(--pri) 14%,transparent);border-color:var(--pri)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
.row small{color:var(--mut);display:block}
.f{display:grid;grid-template-columns:1fr 1fr;gap:8px}.f .w{grid-column:1/-1}
input,select,textarea{width:100%;padding:10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:15px;font-family:inherit}
.btn{border:0;background:var(--pri);color:#fff;padding:10px 14px;border-radius:8px;font-size:14px;font-weight:600}
.btn.s{padding:6px 10px;font-size:13px}.btn.g{background:var(--ok)}.btn.d{background:transparent;color:var(--bad);padding:6px}.btn.l{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.tag{font-size:11px;padding:2px 8px;border-radius:10px;border:1px solid currentColor;white-space:nowrap}
h2{font-size:15px;margin:0 0 10px}.empty{color:var(--mut);text-align:center;padding:14px}
.bars{display:flex;align-items:flex-end;gap:8px}.bars .c{flex:1;display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--mut)}
.bars .p{display:flex;gap:3px;align-items:flex-end;height:100px;width:100%;justify-content:center}.bars i{width:35%;border-radius:3px 3px 0 0;min-height:2px;display:block}
.hb{margin:6px 0;font-size:13px}.hb div{height:8px;border-radius:4px;background:var(--bad);margin-top:3px}
.prog{height:6px;border-radius:3px;background:var(--bd);overflow:hidden;margin:6px 0}.prog div{height:100%;background:var(--ok)}
.sum{display:flex;justify-content:space-between;font-size:13px;padding:2px 0}
</style></head><body>
<header><h1>🪟 Gestão · Esquadrias de Alumínio</h1></header>
<nav id="nav"></nav><main id="app"></main>
<script>
const KEY="esq_gestao_v2";
let S={tx:[],bol:[],rec:[],obras:[],pes:[],pag:[]},tab="dash",M=ym(new Date()),FM=ym(new Date()),EK="func";
try{let r=localStorage.getItem(KEY);if(r)Object.assign(S,JSON.parse(r));else{const o=localStorage.getItem("esq_gestao_v1");if(o){const p=JSON.parse(o);Object.assign(S,p);S.bol=(p.bol||[]).map(b=>({id:b.id,desc:b.desc,who:b.forn,valor:b.valor,venc:b.venc,ok:b.pago}))}}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function ym(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
function iso(d){return ym(d)+"-"+String(d.getDate()).padStart(2,"0")}
const hoje=()=>iso(new Date());
const R=n=>(n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const D=s=>s?s.split("-").reverse().join("/"):"";
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=id=>document.getElementById(id);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const dias=v=>Math.round((new Date(v+"T00:00:00")-new Date(hoje()+"T00:00:00"))/864e5);
const sum=l=>l.reduce((a,x)=>a+x.valor,0);
function addM(s,n){const d=new Date(s+"T00:00:00"),dd=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);d.setDate(Math.min(dd,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));return iso(d)}
const tabs=[["dash","Início"],["cx","Caixa"],["bol","A pagar"],["rec","A receber"],["obras","Obras"],["eq","Equipe"]];
function go(t){tab=t;render()}
function render(){
  $("nav").innerHTML=tabs.map(([k,n])=>`<button class="${k==tab?"on":""}" onclick="go('${k}')">${n}</button>`).join("");
  $("app").innerHTML=alerts()+({dash,cx,bol:()=>cont("bol"),rec:()=>cont("rec"),obras,eq})[tab]();
}
function alerts(){
  const A=(l,t,c,go2)=>l.length?`<div class="alert ${c}" onclick="go('${go2}')">${t} <b>${l.length}</b> · ${R(sum(l))}</div>`:"";
  const ab=S.bol.filter(b=>!b.ok),ar=S.rec.filter(b=>!b.ok);
  return A(ab.filter(b=>dias(b.venc)<0),"⚠️ Boletos vencidos:","r","bol")+A(ab.filter(b=>dias(b.venc)>=0&&dias(b.venc)<=7),"🔔 Boletos a vencer em 7 dias:","y","bol")+A(ar.filter(b=>dias(b.venc)<0),"💰 Clientes em atraso:","b","rec")+A(ar.filter(b=>dias(b.venc)>=0&&dias(b.venc)<=7),"📥 A receber em 7 dias:","b","rec");
}
const saldo=()=>S.tx.reduce((a,t)=>a+(t.tipo=="e"?t.valor:-t.valor),0);
const obraNome=id=>{const o=S.obras.find(x=>x.id==id);return o?o.cliente:""};
const obraOpts=()=>'<option value="">Sem obra vinculada</option>'+S.obras.filter(o=>o.status!="Concluída").map(o=>`<option value="${o.id}">${esc(o.cliente)} – ${esc(o.desc)}</option>`).join("");

function dash(){
  const m=ym(new Date()),tm=S.tx.filter(t=>t.data.startsWith(m)),e=sum(tm.filter(t=>t.tipo=="e")),s=sum(tm.filter(t=>t.tipo=="s")),sd=saldo();
  const ab=S.bol.filter(b=>!b.ok),ar=S.rec.filter(b=>!b.ok);
  const p30=x=>x.filter(b=>dias(b.venc)<=30);
  const folha=sum(S.pes.filter(p=>!S.pag.some(x=>x.pid==p.id&&x.m==m)));
  const pagar=sum(p30(ab))+folha,receber=sum(p30(ar)),proj=sd+receber-pagar;
  let dt=[];for(let i=5;i>=0;i--){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);const k=ym(d),l=S.tx.filter(t=>t.data.startsWith(k));dt.push({k,e:sum(l.filter(t=>t.tipo=="e")),s:sum(l.filter(t=>t.tipo=="s"))})}
  const mx=Math.max(1,...dt.flatMap(x=>[x.e,x.s]));
  const cats={};tm.filter(t=>t.tipo=="s").forEach(t=>cats[t.cat]=(cats[t.cat]||0)+t.valor);
  const cl=Object.entries(cats).sort((a,b)=>b[1]-a[1]).slice(0,5);
  return `<div class="card big"><div class="k">Caixa da empresa</div><div class="v ${sd<0?"bad":"ok"}">${R(sd)}</div></div>
  <div class="grid"><div class="card"><div class="k">Entradas do mês</div><div class="v ok">${R(e)}</div></div><div class="card"><div class="k">Saídas do mês</div><div class="v bad">${R(s)}</div></div>
  <div class="card"><div class="k">Resultado do mês</div><div class="v ${e-s<0?"bad":"ok"}">${R(e-s)}</div></div><div class="card"><div class="k">Obras ativas</div><div class="v">${S.obras.filter(o=>o.status!="Concluída"&&o.status!="Orçamento").length}</div></div></div>
  <div class="card"><h2>📈 Projeção para 30 dias</h2>
   <div class="sum"><span>Caixa hoje</span><b>${R(sd)}</b></div><div class="sum ok"><span>+ A receber</span><b>${R(receber)}</b></div>
   <div class="sum bad"><span>− Boletos</span><b>${R(sum(p30(ab)))}</b></div><div class="sum bad"><span>− Folha/PJ pendente do mês</span><b>${R(folha)}</b></div>
   <div class="sum" style="border-top:1px solid var(--bd);margin-top:6px;padding-top:6px"><b>Saldo previsto</b><b class="${proj<0?"bad":"ok"}">${R(proj)}</b></div>${proj<0?'<div class="bad" style="font-size:13px;margin-top:4px">⚠️ Atenção: caixa previsto negativo</div>':""}</div>
  <div class="card"><h2>Últimos 6 meses</h2><div class="bars">${dt.map(x=>`<div class="c"><div class="p"><i style="height:${x.e/mx*100}%;background:var(--ok)"></i><i style="height:${x.s/mx*100}%;background:var(--bad)"></i></div>${x.k.slice(5)}/${x.k.slice(2,4)}</div>`).join("")}</div><div class="k" style="margin-top:6px"><span class="ok">■</span> Entradas <span class="bad">■</span> Saídas</div></div>
  ${cl.length?`<div class="card"><h2>Onde o dinheiro foi (mês)</h2>${cl.map(([c,v])=>`<div class="hb">${esc(c)} · <b>${R(v)}</b><div style="width:${v/cl[0][1]*100}%"></div></div>`).join("")}</div>`:""}
  <div class="card"><h2>💾 Backup dos dados</h2><textarea id="bk" rows="3" placeholder="Cole aqui um backup para importar"></textarea><div class="f" style="margin-top:8px"><button class="btn l" onclick="exp()">Exportar</button><button class="btn" onclick="imp()">Importar</button></div></div>`;
}
function exp(){const t=$("bk");t.value=JSON.stringify(S);t.select();try{navigator.clipboard.writeText(t.value)}catch(e){}alert("Backup gerado. Copie o texto e guarde em local seguro.")}
function imp(){try{const p=JSON.parse($("bk").value);if(!p.tx)throw 0;if(!confirm("Isto substitui TODOS os dados atuais. Continuar?"))return;S=Object.assign({tx:[],bol:[],rec:[],obras:[],pes:[],pag:[]},p);save();render()}catch(e){alert("Backup inválido")}}

function cx(){
  const l=S.tx.filter(t=>t.data.startsWith(FM)).sort((a,b)=>b.data.localeCompare(a.data)),e=sum(l.filter(t=>t.tipo=="e")),s=sum(l.filter(t=>t.tipo=="s"));
  return `<div class="card"><h2>Novo lançamento</h2><div class="f"><select id="tt"><option value="e">Entrada</option><option value="s">Saída</option></select><input id="tv" type="number" step="0.01" placeholder="Valor R$">
  <input class="w" id="td" placeholder="Descrição"><input id="tdt" type="date" value="${hoje()}"><select id="tc"><option>Venda / Obra</option><option>Material (alumínio, vidro)</option><option>Ferragens e acessórios</option><option>Aluguel</option><option>Impostos</option><option>Veículos / combustível</option><option>Energia / água</option><option>Outros</option></select>
  <select class="w" id="to">${obraOpts()}</select><button class="btn w" onclick="addTx()">Adicionar</button></div></div>
  <div class="card"><div class="f"><div><div class="k">Mês</div><input type="month" value="${FM}" onchange="FM=this.value;render()"></div><div><div class="k">Entradas / Saídas</div><div style="margin-top:8px"><b class="ok">${R(e)}</b> / <b class="bad">${R(s)}</b></div></div></div></div>
  <div class="card"><h2>Movimentações</h2>${l.length?l.map(t=>`<div class="row"><div>${esc(t.desc)}<small>${D(t.data)} · ${esc(t.cat)}${t.obra?" · 🏗 "+esc(obraNome(t.obra)):""}</small></div><div style="text-align:right"><b class="${t.tipo=="e"?"ok":"bad"}">${t.tipo=="e"?"+":"−"}${R(t.valor)}</b><br><button class="btn d" onclick="del('tx','${t.id}')">excluir</button></div></div>`).join(""):'<div class="empty">Sem lançamentos neste mês</div>'}</div>`;
}
function addTx(){const v=parseFloat($("tv").value);if(!v||!$("td").value)return alert("Preencha descrição e valor");S.tx.push({id:uid(),tipo:$("tt").value,valor:v,desc:$("td").value,data:$("tdt").value||hoje(),cat:$("tc").value,obra:$("to").value});save();render()}

function cont(k){
  const pg=k=="bol",l=[...S[k]].sort((a,b)=>(a.ok-b.ok)||a.venc.localeCompare(b.venc)),ab=S[k].filter(x=>!x.ok);
  return `<div class="card"><h2>${pg?"Novo boleto / conta a pagar":"Nova conta a receber"}</h2><div class="f"><input class="w" id="cd" placeholder="Descrição">
  <input id="cw" placeholder="${pg?"Fornecedor":"Cliente"}"><input id="cv" type="number" step="0.01" placeholder="Valor R$ (cada parcela)"><input id="cq" type="date" value="${hoje()}"><input id="cn" type="number" min="1" value="1" placeholder="Parcelas">
  <select class="w" id="co">${obraOpts()}</select><button class="btn w" onclick="addC('${k}')">Adicionar</button></div></div>
  <div class="card"><div class="sum"><span>Total em aberto</span><b class="${pg?"warn":"ok"}">${R(sum(ab))}</b></div></div>
  <div class="card"><h2>${pg?"Boletos":"Recebimentos"}</h2>${l.length?l.map(b=>{const d=dias(b.venc);let st=b.ok?`<span class="tag ok">${pg?"Pago":"Recebido"}</span>`:d<0?`<span class="tag bad">${pg?"Vencido":"Atrasado"} há ${-d}d</span>`:d<=7?`<span class="tag warn">${d?"Vence em "+d+"d":"Vence hoje"}</span>`:`<span class="tag mut">Em ${d}d</span>`;
  return `<div class="row"><div>${esc(b.desc)}<small>${esc(b.who||"")} · ${D(b.venc)}${b.obra?" · 🏗 "+esc(obraNome(b.obra)):""}</small>${st}</div><div style="text-align:right"><b>${R(b.valor)}</b><br>${b.ok?"":`<button class="btn s g" onclick="quit('${k}','${b.id}')">${pg?"Pagar":"Receber"}</button>`}<button class="btn d" onclick="del('${k}','${b.id}')">✕</button></div></div>`}).join(""):'<div class="empty">Nada cadastrado</div>'}</div>`;
}
function addC(k){const v=parseFloat($("cv").value),n=Math.max(1,parseInt($("cn").value)||1);if(!v||!$("cd").value||!$("cq").value)return alert("Preencha descrição, valor e vencimento");
  for(let i=0;i<n;i++)S[k].push({id:uid(),desc:$("cd").value+(n>1?` (${i+1}/${n})`:""),who:$("cw").value,valor:v,venc:addM($("cq").value,i),ok:false,obra:$("co").value});save();render()}
function quit(k,id){const b=S[k].find(x=>x.id==id);b.ok=true;S.tx.push({id:uid(),tipo:k=="bol"?"s":"e",valor:b.valor,desc:(k=="bol"?"Boleto: ":"Recebido: ")+b.desc,data:hoje(),cat:k=="bol"?"Boleto":"Venda / Obra",obra:b.obra||""});save();render()}

const ST=["Orçamento","Aprovada","Em produção","Instalada","Concluída"];
function obras(){
  return `<div class="card"><h2>Nova obra / orçamento</h2><div class="f"><input id="oc" placeholder="Cliente"><input id="ov" type="number" step="0.01" placeholder="Valor do contrato R$"><input class="w" id="od" placeholder="Descrição (ex: 6 janelas + 2 portas de correr)"><select class="w" id="os">${ST.map(s=>`<option>${s}</option>`).join("")}</select><button class="btn w" onclick="addO()">Cadastrar</button></div></div>
  ${S.obras.length?S.obras.map(o=>{const t=S.tx.filter(x=>x.obra==o.id),rc=sum(t.filter(x=>x.tipo=="e")),ct=sum(t.filter(x=>x.tipo=="s")),pc=Math.min(100,rc/(o.valor||1)*100);
  return `<div class="card"><div class="row" style="border:0;padding:0"><div><b>${esc(o.cliente)}</b><small>${esc(o.desc)}</small></div><b>${R(o.valor)}</b></div>
  <div class="prog"><div style="width:${pc}%"></div></div>
  <div class="sum"><span>Recebido (${pc.toFixed(0)}%)</span><b class="ok">${R(rc)}</b></div><div class="sum"><span>Falta receber</span><b>${R(Math.max(0,o.valor-rc))}</b></div><div class="sum"><span>Custos lançados</span><b class="bad">${R(ct)}</b></div><div class="sum"><span>Lucro até agora</span><b class="${rc-ct<0?"bad":"ok"}">${R(rc-ct)}</b></div>
  <div class="f" style="margin-top:8px"><select onchange="stO('${o.id}',this.value)">${ST.map(s=>`<option ${s==o.status?"selected":""}>${s}</option>`).join("")}</select><button class="btn d" onclick="del('obras','${o.id}')">excluir</button></div></div>`}).join(""):'<div class="empty">Cadastre obras para ver lucro por cliente. Vincule boletos, recebimentos e lançamentos a elas.</div>'}`;
}
function addO(){const v=parseFloat($("ov").value);if(!v||!$("oc").value)return alert("Preencha cliente e valor");S.obras.push({id:uid(),cliente:$("oc").value,desc:$("od").value,valor:v,status:$("os").value});save();render()}
function stO(id,s){S.obras.find(o=>o.id==id).status=s;save();render()}

function eq(){
  const k=EK,l=S.pes.filter(p=>p.k==k),pago=l.filter(p=>S.pag.some(x=>x.pid==p.id&&x.m==M));
  return `<div style="display:flex;gap:6px;margin-bottom:10px"><button class="chip ${k=="func"?"on":""}" onclick="EK='func';render()">Funcionários</button><button class="chip ${k=="pj"?"on":""}" onclick="EK='pj';render()">Prestadores PJ</button></div>
  <div class="card"><h2>Novo ${k=="func"?"funcionário":"prestador PJ"}</h2><div class="f"><input id="pn" placeholder="Nome"><input id="pc" placeholder="${k=="func"?"Cargo (ex: serralheiro)":"Serviço / CNPJ"}"><input class="w" id="pv" type="number" step="0.01" placeholder="Valor mensal R$"><button class="btn w" onclick="addP()">Cadastrar</button></div></div>
  <div class="card"><div class="f"><div><div class="k">Mês de referência</div><input type="month" value="${M}" onchange="M=this.value;render()"></div><div><div class="k">Pago / Total</div><div style="margin-top:8px"><b>${R(sum(pago))}</b> / ${R(sum(l))}</div></div></div></div>
  <div class="card"><h2>${k=="func"?"Folha de pagamento":"Pagamentos PJ"}</h2>${l.length?l.map(p=>{const pg=S.pag.some(x=>x.pid==p.id&&x.m==M);
  return `<div class="row"><div>${esc(p.nome)}<small>${esc(p.cargo)}</small><span class="tag ${pg?"ok":"warn"}">${pg?"Pago":"Pendente"}</span></div><div style="text-align:right"><b>${R(p.valor)}</b><br>${pg?`<button class="btn d" onclick="desfaz('${p.id}')">desfazer</button>`:`<button class="btn s g" onclick="pagaP('${p.id}')">Pagar</button>`}<button class="btn d" onclick="del('pes','${p.id}')">✕</button></div></div>`}).join(""):'<div class="empty">Nenhum cadastro</div>'}</div>`;
}
function addP(){const v=parseFloat($("pv").value);if(!v||!$("pn").value)return alert("Preencha nome e valor");S.pes.push({id:uid(),k:EK,nome:$("pn").value,cargo:$("pc").value,valor:v});save();render()}
function pagaP(id){const p=S.pes.find(x=>x.id==id),tid=uid();S.pag.push({pid:id,m:M,tid});S.tx.push({id:tid,tipo:"s",valor:p.valor,desc:(p.k=="func"?"Salário: ":"PJ: ")+p.nome+" ("+M.slice(5)+"/"+M.slice(0,4)+")",data:hoje(),cat:p.k=="func"?"Salários":"Prestadores PJ"});save();render()}
function desfaz(id){const x=S.pag.find(a=>a.pid==id&&a.m==M);if(!x)return;S.tx=S.tx.filter(t=>t.id!=x.tid);S.pag=S.pag.filter(a=>a!==x);save();render()}
function del(c,id){if(!confirm("Excluir este item?"))return;S[c]=S[c].filter(x=>x.id!=id);if(c=="pes")S.pag=S.pag.filter(x=>x.pid!=id);save();render()}
render();
</script></body></html>
